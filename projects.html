        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const filterButtons = document.querySelectorAll('.filter-btn');
                const projectItems = document.querySelectorAll('.project-item');
                const projectModal = document.getElementById('projectModal');
                const modalMediaContainer = document.getElementById('modal-media-container');
                const modalTitle = document.getElementById('modal-title');
                const modalDescription = document.getElementById('modal-description');
                const projectModalLabel = document.getElementById('projectModalLabel');

                // Autoplay videos on hover
                document.querySelectorAll('.project-card video').forEach(video => {
                    video.addEventListener('mouseenter', () => { video.play().catch(e => console.log("Hover play failed")); });
                    video.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
                });

                // Filter functionality
                filterButtons.forEach(button => {
                    button.addEventListener('click', function () {
                        filterButtons.forEach(btn => btn.classList.replace('btn-primary', 'btn-outline-primary'));
                        this.classList.replace('btn-outline-primary', 'btn-primary');
                        const filter = this.getAttribute('data-filter');
                        projectItems.forEach(item => {
                            item.style.display = (filter === 'all' || item.getAttribute('data-category') === filter) ? 'block' : 'none';
                        });
                    });
                });

                // Modal content population
                projectModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget.closest('.project-item');
                    const mediaType = button.getAttribute('data-media-type');
                    const mediaSrcAttr = button.getAttribute('data-media-src');
                    const title = button.getAttribute('data-title');
                    const description = button.getAttribute('data-description');

                    projectModalLabel.textContent = title;
                    modalTitle.textContent = title;
                    modalDescription.textContent = description;

                    modalMediaContainer.innerHTML = ''; // Clear previous media

                    if (mediaType === 'image') {
                        const img = document.createElement('img');
                        img.src = mediaSrcAttr;
                        img.className = 'img-fluid rounded';
                        modalMediaContainer.appendChild(img);
                    } else if (mediaType === 'video') {
                        const video = document.createElement('video');
                        video.src = mediaSrcAttr;
                        video.className = 'video-fluid rounded';
                        video.controls = true;
                        video.autoplay = true;
                        modalMediaContainer.appendChild(video);
                    } else if (mediaType === 'carousel') {
                        const mediaSrcs = JSON.parse(mediaSrcAttr.replace(/'/g, '"'));
                        const carouselId = 'modalCarousel';
                        const carouselHTML = `
                            <div id="${carouselId}" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-inner">
                                    ${mediaSrcs.map((media, index) => {
                                        let itemHTML = '';
                                        if (media.type === 'image') {
                                            itemHTML = `<img src="${media.src}" class="d-block w-100" alt="Slide ${index + 1}">`;
                                        } else if (media.type === 'video') {
                                            itemHTML = `<video src="${media.src}" class="d-block w-100" controls></video>`;
                                        }
                                        return `<div class="carousel-item ${index === 0 ? 'active' : ''}">${itemHTML}</div>`;
                                    }).join('')}
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#${carouselId}" data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Previous</span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#${carouselId}" data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Next</span>
                                </button>
                            </div>`;
                        modalMediaContainer.innerHTML = carouselHTML;
                    }
                });

                // Stop media when modal is closed
                projectModal.addEventListener('hide.bs.modal', function () {
                    modalMediaContainer.querySelectorAll('video').forEach(video => video.pause());
                });
            });
        </script>
